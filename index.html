<div class="drawer" id="syncDrawer"><div class="sheet"><div class="grab"></div><h2>同步素材</h2><div class="small">推荐批量素材放进同一个文件夹，文件名使用「组别_名称_辅助词.ext」。如果视频还在 iPad 相册，也可以从相册/文件多选导入。</div><div class="file-input"><button class="btn primary" id="chooseFolder">选择/更换素材文件夹</button><button class="btn" id="rescanFolder">更新上次文件夹</button><button class="btn" id="choosePhotos">从相册/文件选择视频</button><button class="btn danger" id="clearLocal">清空本地素材</button></div><div class="small" id="folderHint"></div><div id="syncStatus"></div><div class="filelist" id="syncList"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" id="closeDrawer">完成</button></div></div></div>

const DB='mango-video-cards-v22',STORE='videos',META='meta',VER=2;let db,allItems=[],groupItems=[],currentGroup=localStorage.getItem('lastGroup')||'全部';let idx=Number(localStorage.getItem('lastIdx')||0),mode=localStorage.getItem('mode')||'read';let startX=0,startY=0,touchCount=0,currentVideoURL=null,currentCoverURL=null,maxTimer=null;let rippleTimer=null,currentSearch='',isPlaying=false,isTransitioning=false,exitPressTimer=null;let gridURLs=[],fullscreenRequested=false,loadingTimer=null;const $=id=>document.getElementById(id);

function parseName(filename){const base=filename.replace(/\.[^.]+$/,'');const parts=base.split('_').map(x=>x.trim()).filter(Boolean);if(parts.length<2)return{group:'待命名',name:base.replace(/^IMG[_-]?/i,'视频')||'视频',alias:'',key:base};return{group:parts[0],name:parts[1],alias:parts.slice(2).join(' '),key:base}}function extOK(f){return f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name)}function isTopLevel(f){const p=f.webkitRelativePath||f.name;return p.split('/').filter(Boolean).length<=2}function title(it){return it.alias?`${it.name}：${it.alias}`:it.name}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function loadLibrary(){allItems=await getAll();allItems.sort((a,b)=>a.group.localeCompare(b.group,'zh-CN')||a.name.localeCompare(b.name,'zh-CN')||a.alias.localeCompare(b.alias,'zh-CN'));if(currentGroup!=='全部'&&currentGroup!=='最近添加'&&!allItems.some(x=>x.group===currentGroup))currentGroup='全部';renderGroups();selectGroup(currentGroup,false);$('totalText').textContent=`${allItems.length} 个素材`;updateFolderHint()}function groupsWithCounts(){const c={};allItems.forEach(x=>c[x.group]=(c[x.group]||0)+1);return[['全部',allItems.length],['最近添加',allItems.length],...Object.keys(c).sort((a,b)=>a.localeCompare(b,'zh-CN')).map(g=>[g,c[g]])]}function renderGroups(){const box=$('groups');box.innerHTML='<div class="side-title">目录</div>';for(const[g,n]of groupsWithCounts()){const b=document.createElement('button');b.className='group'+(g===currentGroup?' active':'');b.innerHTML=`<span>${esc(g)}</span><span class="count">${n}</span>`;b.onclick=()=>selectGroup(g,true);box.appendChild(b)}}function groupArray(g){return g==='全部'?[...allItems]:(g==='最近添加'?[...allItems].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)):allItems.filter(x=>x.group===g))}

function stopRipple(){if(rippleTimer){clearTimeout(rippleTimer);rippleTimer=null}document.querySelectorAll('.ripple-guide').forEach(x=>x.remove())}function scheduleRipple(first=true){stopRipple();if(mode!=='read'||isPlaying||isTransitioning||!groupItems.length)return;const delay=first?(1200+Math.random()*900):(3800+Math.random()*2600);rippleTimer=setTimeout(()=>{showRipple();scheduleRipple(false)},delay)}function showRipple(){if(mode!=='read'||isPlaying||isTransitioning||!groupItems.length)return;const r=document.createElement('div'),dot=document.createElement('span');const x=18+Math.random()*64,y=18+Math.random()*48;const s=(document.body.classList.contains('child-mode')?120:92)+Math.random()*62;r.className='ripple-guide';dot.className='ripple-dot';r.appendChild(dot);r.style.setProperty('--x',x+'%');r.style.setProperty('--y',y+'%');r.style.setProperty('--s',s+'px');$('viewer').appendChild(r);setTimeout(()=>r.remove(),2100)}function stopLoading(){if(loadingTimer){clearTimeout(loadingTimer);loadingTimer=null}document.querySelectorAll('.media-loading').forEach(x=>x.remove())}function showLoadingSoon(){stopLoading();loadingTimer=setTimeout(()=>{if(!isPlaying)return;const s=document.createElement('div');s.className='media-loading show';$('media').appendChild(s)},260)}

function finishPlayback(v,{error=false}={}){if(!isPlaying)return;if(maxTimer){clearTimeout(maxTimer);maxTimer=null}stopLoading();v.classList.remove('show');$('viewer').classList.remove('wake');const cleanup=()=>{try{v.pause()}catch(e){}v.remove();revokeVideoURL();isPlaying=false;if(error)toast('视频播放失败，轻点可重试');scheduleRipple(true)};setTimeout(cleanup,220)}function playCurrent(){if(!groupItems.length||isPlaying||isTransitioning)return;const it=groupItems[idx],media=$('media');isPlaying=true;stopRipple();$('viewer').classList.add('wake');revokeVideoURL();showLoadingSoon();currentVideoURL=URL.createObjectURL(it.video);const v=document.createElement('video');v.src=currentVideoURL;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.controls=false;v.preload='auto';v.muted=false;v.className='video-layer';if(currentCoverURL)v.poster=currentCoverURL;media.appendChild(v);let started=false;const onStart=()=>{if(started)return;started=true;stopLoading();v.classList.add('show');$('viewer').classList.remove('wake')};v.onplaying=onStart;v.oncanplay=()=>{if(!started&&v.currentTime>0)onStart()};v.onended=()=>finishPlayback(v);v.onerror=()=>finishPlayback(v,{error:true});const safety=Math.min(Math.max(((it.duration||3)+1.1)*1000,5000),9000);maxTimer=setTimeout(()=>finishPlayback(v),safety);const p=v.play();if(p&&p.catch)p.catch(()=>finishPlayback(v,{error:true}))}
async function animateSwitch(direction,phase){const viewer=$('viewer');if(!viewer.animate)return;const out=phase==='out',x=(direction>0?-1:1)*(out?34:-34);const frames=out?[{transform:'translateX(0)',opacity:1},{transform:`translateX(${x}px)`,opacity:.18}]:[{transform:`translateX(${-x}px)`,opacity:.18},{transform:'translateX(0)',opacity:1}];try{await viewer.animate(frames,{duration:out?135:215,easing:out?'ease-in':'cubic-bezier(.2,.8,.2,1)',fill:'both'}).finished}catch(e){}}async function go(d){if(!groupItems.length||isPlaying||isTransitioning)return;isTransitioning=true;stopRipple();await animateSwitch(d,'out');idx=(idx+d+groupItems.length)%groupItems.length;savePosition();renderCard();await animateSwitch(d,'in');$('viewer').getAnimations?.().forEach(a=>a.cancel());isTransitioning=false;scheduleRipple(true)}
$('viewer').onclick=e=>{if(mode!=='read'||isTransitioning)return;if(e.target.closest('#exitHotspot')||e.target.closest('.nav'))return;if(isPlaying)return;playCurrent()};$('prev').onclick=e=>{e.stopPropagation();go(-1)};$('next').onclick=e=>{e.stopPropagation();go(1)};const vw=$('viewer');vw.addEventListener('touchstart',e=>{touchCount=e.touches.length;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});vw.addEventListener('touchend',e=>{if(isPlaying||isTransitioning)return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(document.body.classList.contains('child-mode')&&touchCount>=3&&dy>70){setChildMode(false);return}if(touchCount===1&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx>0?-1:1)},{passive:true});
function clearGridURLs(){gridURLs.forEach(URL.revokeObjectURL);gridURLs=[]}function renderGrid(){clearGridURLs();const grid=$('grid');grid.innerHTML='';if(!groupItems.length){grid.innerHTML='<div class="empty"><strong>没有匹配素材。</strong><br>可以换一个组别，或清空搜索。</div>';return}for(const it of groupItems){const tile=document.createElement('button'),url=URL.createObjectURL(it.cover);gridURLs.push(url);tile.className='tile';tile.innerHTML=`<img src="${url}" alt=""><div class="tmeta"><strong>${esc(title(it))}</strong><span>${esc(it.group)}</span></div>`;tile.onclick=()=>{const arr=groupArray(currentGroup);groupItems=arr;idx=Math.max(0,groupItems.findIndex(x=>x.key===it.key));savePosition();setMode('read')};grid.appendChild(tile)}}
function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement||null}async function tryFullscreen(on){try{if(on){fullscreenRequested=true;const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)await el.webkitRequestFullscreen()}else{fullscreenRequested=false;if(fullscreenElement()){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)await document.webkitExitFullscreen()}}}catch(e){}}function toast(msg){const t=$('exitToast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1400)}function applyChildUI(on){document.body.classList.toggle('child-mode',on);$('childBtn').textContent=on?'退出全屏':'儿童全屏';if(on){setMode('read');scheduleRipple(true)}else stopRipple()}async function setChildMode(on,{fromFullscreenEvent=false}={}){if(on){applyChildUI(true);await tryFullscreen(true);toast('三指下滑或左上角长按可退出')}else{applyChildUI(false);if(!fromFullscreenEvent)await tryFullscreen(false)}}$('childBtn').onclick=()=>setChildMode(!document.body.classList.contains('child-mode'));$('exitHotspot').addEventListener('touchstart',()=>{clearTimeout(exitPressTimer);exitPressTimer=setTimeout(()=>setChildMode(false),900)},{passive:true});$('exitHotspot').addEventListener('touchend',()=>clearTimeout(exitPressTimer),{passive:true});$('exitHotspot').addEventListener('touchcancel',()=>clearTimeout(exitPressTimer),{passive:true});function onFullscreenChange(){if(fullscreenRequested&&!fullscreenElement()&&document.body.classList.contains('child-mode')){fullscreenRequested=false;setChildMode(false,{fromFullscreenEvent:true})}if(!document.body.classList.contains('child-mode'))$('childBtn').textContent='儿童全屏'}document.addEventListener('fullscreenchange',onFullscreenChange);document.addEventListener('webkitfullscreenchange',onFullscreenChange);
const drawer=$('syncDrawer'),folderPicker=$('folderPicker'),photoPicker=$('photoPicker');$('syncBtn').onclick=()=>{drawer.classList.add('show');updateFolderHint()};$('closeDrawer').onclick=()=>drawer.classList.remove('show');$('choosePhotos').onclick=()=>photoPicker.click();$('clearLocal').onclick=async()=>{if(!confirm('确定清空本地素材？不会删除相册或文件里的原视频。'))return;await clearStore();allItems=[];currentGroup='全部';idx=0;await loadLibrary();$('syncStatus').innerHTML='<div class="sync-summary good">已清空本地素材库。</div>'};
async function updateFolderHint(){const hint=$('folderHint');if(!db)return;const name=await getMeta('folderName').catch(()=>null);const hasHandle=!!(await getMeta('folderHandle').catch(()=>null));if(name)hint.textContent=`上次素材文件夹：${name}${hasHandle?'（可尝试一键更新）':'（当前浏览器需要重新授权后扫描）'}`;else hint.textContent='尚未选择素材文件夹。'}async function listDirectoryHandle(dir){const files=[];for await(const [name,handle] of dir.entries()){if(handle.kind!=='file')continue;const f=await handle.getFile();if(extOK(f))files.push(f)}return files}async function ensureHandlePermission(handle){try{if(!handle)return false;if(!handle.queryPermission)return true;let p=await handle.queryPermission({mode:'read'});if(p==='granted')return true;if(p==='prompt'&&handle.requestPermission)p=await handle.requestPermission({mode:'read'});return p==='granted'}catch(e){return false}}
async function chooseFolderModern(){if(!window.showDirectoryPicker)return false;try{const dir=await window.showDirectoryPicker({mode:'read'});await setMeta('folderHandle',dir);await setMeta('folderName',dir.name||'素材文件夹');const files=await listDirectoryHandle(dir);await syncFiles(files,{folderMode:true});updateFolderHint();return true}catch(e){if(e?.name!=='AbortError')console.warn(e);return true}}$('chooseFolder').onclick=async()=>{const handled=await chooseFolderModern();if(!handled)folderPicker.click()};$('rescanFolder').onclick=async()=>{const handle=await getMeta('folderHandle').catch(()=>null);if(handle&&await ensureHandlePermission(handle)){$('syncStatus').innerHTML='<div class="sync-summary">正在扫描上次素材文件夹…</div>';try{const files=await listDirectoryHandle(handle);await syncFiles(files,{folderMode:true});return}catch(e){console.warn(e)}}$('syncStatus').innerHTML='<div class="sync-summary">iPad Safari/PWA 无法在没有再次授权的情况下持续读取外部文件夹。已为你打开文件夹选择器；通常会停留在最近使用的位置。</div>';folderPicker.click()};
async function syncFiles(files,{folderMode=false}={}){const raw=[...files].filter(extOK),status=$('syncStatus'),list=$('syncList');list.innerHTML='';if(!raw.length){status.innerHTML='<div class="sync-summary bad">没有识别到视频。</div>';return}const valid=[],nested=[],duplicate=[],seen=new Set();for(const f of raw){if(folderMode&&!isTopLevel(f)&&f.webkitRelativePath){nested.push({f,reason:'多级目录'});continue}const meta=parseName(f.name);if(seen.has(meta.key)){duplicate.push({f,reason:'同名重复'});continue}seen.add(meta.key);valid.push({f,meta})}status.innerHTML=`<div class="sync-summary">发现 <b>${raw.length}</b> 个视频；有效 <b class="good">${valid.length}</b> 个；忽略 <b class="bad">${nested.length+duplicate.length}</b> 个。准备同步…</div>`;[...valid.map(x=>({...x,reason:'有效'})),...nested,...duplicate].slice(0,120).forEach(x=>{const meta=x.meta,r=document.createElement('div');r.className='file-row';const left=meta?`${esc(meta.group)} / ${esc(meta.name)}${meta.alias?' / '+esc(meta.alias):''}`:`<span class="bad">${esc(x.reason)}</span>`;r.innerHTML=`<span>${left}</span><span>${esc(x.f.name)}</span>`;list.appendChild(r)});try{const old=await getAll(),oldMap=new Map(old.map(x=>[x.key,x])),nextKeys=new Set(valid.map(x=>x.meta.key));let skipped=0,imported=0,deleted=0;for(let i=0;i<valid.length;i++){const{f,meta}=valid[i],prev=oldMap.get(meta.key),unchanged=prev&&prev.size===f.size&&prev.lastModified===f.lastModified&&prev.filename===f.name;if(unchanged){skipped++;continue}status.innerHTML=`<div class="sync-summary">正在处理 ${i+1} / ${valid.length}：<b>${esc(meta.name)}</b><br>正在提取封面…</div>`;const ex=await fileToCoverAndDuration(f);await putItem({key:meta.key,group:meta.group,name:meta.name,alias:meta.alias||'',filename:f.name,size:f.size,lastModified:f.lastModified,video:f,cover:ex.cover,duration:ex.duration,width:ex.width,height:ex.height,addedAt:prev?.addedAt||Date.now(),updatedAt:Date.now()});imported++}if(folderMode){for(const oldItem of old){if(!nextKeys.has(oldItem.key)){await deleteKey(oldItem.key);deleted++}}}currentGroup='最近添加';idx=0;await loadLibrary();status.innerHTML=`<div class="sync-summary good"><b>同步完成。</b><br>新增/更新：${imported}；跳过未变化：${skipped}${folderMode?'；删除本地失效：'+deleted:''}；忽略异常：${nested.length+duplicate.length}。</div>`}catch(e){console.error(e);status.innerHTML=`<div class="sync-summary bad"><b>同步失败：</b>${esc(e.message||String(e))}<br>建议优先使用 H.264/AAC 的 MP4/MOV。</div>`}}
