<div class="app"><header><div class="brand"><strong>认知世界</strong><span id="totalText">0 个素材</span></div><div class="actions"><button class="btn" id="childBtn">儿童全屏</button><button class="btn" id="modeBtn">家长模式</button><button class="btn primary" id="syncBtn">同步素材</button></div></header><div class="content"><aside class="sidebar" id="groups"><div class="side-title">目录</div></aside><section class="stage"><div class="topbar"><div class="group-name" id="currentGroup">全部</div><div class="search" id="searchBox"><input id="searchInput" placeholder="搜索名称 / 辅助词"></div></div><div class="workspace"><div class="scroller" id="reader"><button class="nav prev" id="prev">‹</button><div class="viewer" id="viewer"><div class="empty" id="empty"><strong>把短视频放进素材文件夹，或从相册多选导入。</strong><br>文件名建议用「组别_名称_辅助词」，例如：动物_鸭子_嘎嘎.mp4<br><br>点右上角“同步素材”开始。</div><div class="media" id="media" style="display:none"></div><div class="label" id="label" style="display:none"><div class="name" id="itemName"></div><div class="alias" id="itemAlias"></div><div class="hint">轻点封面播放一次；播完自动回到封面</div></div><div class="counter" id="counter"></div></div><button class="nav next" id="next">›</button></div><div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div></div></div></section></div></div>

<div class="drawer" id="syncDrawer"><div class="sheet"><div class="grab"></div><h2>同步素材</h2><div class="small">推荐批量素材放进同一个文件夹，文件名使用「组别_名称_辅助词.ext」。如果视频还在 iPad 相册，也可以点“从相册/文件选择视频”多选导入。相册导入时若文件名不是这个格式，会先放入“待命名”组。</div><div class="file-input"><button class="btn primary" id="chooseFolder">选择素材文件夹</button><button class="btn" id="choosePhotos">从相册/文件选择视频</button><button class="btn danger" id="clearLocal">清空本地素材</button></div><div id="syncStatus"></div><div class="filelist" id="syncList"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" id="closeDrawer">完成</button></div></div></div>
<div class="install-tip" id="installTip"><button id="closeTip">×</button> Safari → 分享 → 添加到主屏幕。首次同步完成后，程序与素材都可离线使用。</div><div class="exit-hotspot" id="exitHotspot" aria-hidden="true"></div><div class="exit-toast" id="exitToast">已退出儿童全屏</div>
<script>
const DB='mango-video-cards-v22',STORE='videos',VER=1,MAX_PLAY_MS=3000;let db,allItems=[],currentGroup=localStorage.getItem('lastGroup')||'全部',groupItems=[],idx=Number(localStorage.getItem('lastIdx')||0),mode=localStorage.getItem('mode')||'read',startX=0,startY=0,touchCount=0,currentVideoURL=null,currentCoverURL=null,maxTimer=null,rippleTimer=null,currentSearch='',isPlaying=false,exitPressTimer=null;const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function os(m='readonly'){return db.transaction(STORE,m).objectStore(STORE)}function getAll(){return new Promise((res,rej)=>{const r=os().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function putItem(x){return new Promise((res,rej)=>{const r=os('readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function deleteKey(k){return new Promise((res,rej)=>{const r=os('readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function clearStore(){return new Promise((res,rej)=>{const r=os('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function parseName(filename){const base=filename.replace(/\.[^.]+$/,'');const parts=base.split('_').map(x=>x.trim()).filter(Boolean);if(parts.length<2)return{group:'待命名',name:base.replace(/^IMG[_-]?/i,'视频')||'视频',alias:'',key:base};return{group:parts[0],name:parts[1],alias:parts.slice(2).join(' '),key:base}}function extOK(f){return f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name)}function isTopLevel(f){const p=f.webkitRelativePath||f.name;return p.split('/').filter(Boolean).length<=2}function title(it){return it.alias?`${it.name}：${it.alias}`:it.name}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fileToCoverAndDuration(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;v.src=url;let done=false;const cleanup=()=>URL.revokeObjectURL(url),fail=m=>{if(done)return;done=true;cleanup();reject(new Error(m))};v.onloadedmetadata=()=>{let d=v.duration||0,t=Math.min(.2,Math.max(0,d*.05));if(!isFinite(t))t=0;try{v.currentTime=t}catch(e){fail('无法定位视频帧')}};v.onseeked=()=>{if(done)return;try{const w=v.videoWidth||1280,h=v.videoHeight||720,max=1200,scale=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob)return fail('封面生成失败');done=true;cleanup();resolve({cover:blob,duration:v.duration||0,width:w,height:h})},'image/jpeg',.86)}catch(e){fail(e.message||'封面生成失败')}};v.onerror=()=>fail('视频无法读取。建议使用 H.264/AAC 的 MP4/MOV。');setTimeout(()=>{if(!done&&v.readyState<1)fail('视频读取超时')},1e4)})}
async function loadLibrary(){allItems=await getAll();allItems.sort((a,b)=>a.group.localeCompare(b.group,'zh-CN')||a.name.localeCompare(b.name,'zh-CN')||a.alias.localeCompare(b.alias,'zh-CN'));if(currentGroup!=='全部'&&currentGroup!=='最近添加'&&!allItems.some(x=>x.group===currentGroup))currentGroup='全部';renderGroups();selectGroup(currentGroup,false);$('totalText').textContent=`${allItems.length} 个素材`}function groupsWithCounts(){const c={};allItems.forEach(x=>c[x.group]=(c[x.group]||0)+1);return[['全部',allItems.length],['最近添加',allItems.length],...Object.keys(c).sort((a,b)=>a.localeCompare(b,'zh-CN')).map(g=>[g,c[g]])]}function renderGroups(){const box=$('groups');box.innerHTML='<div class="side-title">目录</div>';for(const[g,n]of groupsWithCounts()){const b=document.createElement('button');b.className='group'+(g===currentGroup?' active':'');b.innerHTML=`<span>${esc(g)}</span><span class="count">${n}</span>`;b.onclick=()=>selectGroup(g,true);box.appendChild(b)}}
function selectGroup(g,reset=true){currentGroup=g;localStorage.setItem('lastGroup',g);let base=g==='全部'?[...allItems]:(g==='最近添加'?[...allItems].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)):allItems.filter(x=>x.group===g));if(mode==='manage'&&currentSearch.trim()){const q=currentSearch.trim().toLowerCase();base=base.filter(x=>(x.name+x.alias+x.group+x.filename).toLowerCase().includes(q))}groupItems=base;if(reset)idx=0;if(idx>=groupItems.length)idx=0;localStorage.setItem('lastIdx',idx);$('currentGroup').textContent=g;renderGroups();renderCurrentMode()}function setMode(next){mode=next;localStorage.setItem('mode',mode);$('modeBtn').textContent=mode==='read'?'家长模式':'共读模式';$('searchBox').classList.toggle('show',mode==='manage');renderCurrentMode()}function renderCurrentMode(){$('reader').style.display=mode==='read'?'flex':'none';$('gridwrap').classList.toggle('show',mode==='manage');mode==='read'?renderCard():renderGrid()}$('modeBtn').onclick=()=>setMode(mode==='read'?'manage':'read');$('searchInput').oninput=e=>{currentSearch=e.target.value;selectGroup(currentGroup,false)};
function stopRipple(){if(rippleTimer){clearTimeout(rippleTimer);rippleTimer=null}document.querySelectorAll('.ripple-guide').forEach(x=>x.remove())}function scheduleRipple(){stopRipple();if(!document.body.classList.contains('child-mode')||isPlaying||!groupItems.length)return;const delay=900+Math.random()*1800;rippleTimer=setTimeout(()=>{showRipple();scheduleRipple()},delay)}function showRipple(){if(!document.body.classList.contains('child-mode')||isPlaying)return;const r=document.createElement('div'),x=24+Math.random()*52,y=24+Math.random()*44,s=92+Math.random()*86;r.className='ripple-guide';r.style.setProperty('--x',x+'%');r.style.setProperty('--y',y+'%');r.style.setProperty('--s',s+'px');$('viewer').appendChild(r);setTimeout(()=>r.remove(),2100)}function revokeVideoURL(){if(currentVideoURL){URL.revokeObjectURL(currentVideoURL);currentVideoURL=null}if(maxTimer){clearTimeout(maxTimer);maxTimer=null}}function revokeCardURLs(){revokeVideoURL();if(currentCoverURL){URL.revokeObjectURL(currentCoverURL);currentCoverURL=null}}
function renderCard(){isPlaying=false;revokeCardURLs();stopRipple();const empty=$('empty'),media=$('media'),label=$('label'),counter=$('counter');media.innerHTML='';$('viewer').classList.remove('wake');if(!groupItems.length){empty.style.display='block';media.style.display='none';label.style.display='none';counter.textContent='';return}empty.style.display='none';media.style.display='flex';label.style.display='flex';const it=groupItems[idx];currentCoverURL=URL.createObjectURL(it.cover);const img=document.createElement('img');img.src=currentCoverURL;img.alt=it.name;img.draggable=false;img.className='cover-layer';media.appendChild(img);$('itemName').textContent=title(it);$('itemAlias').textContent='';counter.textContent=`${idx+1} / ${groupItems.length}`;scheduleRipple()}function playCurrent(){if(!groupItems.length||isPlaying)return;const it=groupItems[idx],media=$('media');isPlaying=true;stopRipple();$('viewer').classList.add('wake');revokeVideoURL();currentVideoURL=URL.createObjectURL(it.video);const v=document.createElement('video');v.src=currentVideoURL;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.controls=false;v.preload='auto';v.muted=false;v.className='video-layer';if(currentCoverURL)v.poster=currentCoverURL;media.appendChild(v);const back=()=>{isPlaying=false;renderCard()};v.onplaying=()=>{v.classList.add('show');$('viewer').classList.remove('wake')};v.onended=back;v.onerror=back;maxTimer=setTimeout(back,MAX_PLAY_MS);const p=v.play();if(p&&p.catch)p.catch(()=>{v.controls=true;v.classList.add('show')})}
function go(d){if(!groupItems.length||isPlaying)return;idx=(idx+d+groupItems.length)%groupItems.length;localStorage.setItem('lastIdx',idx);renderCard();const v=$('viewer');v.classList.remove('switch-next','switch-prev');void v.offsetWidth;v.classList.add(d>0?'switch-next':'switch-prev');setTimeout(()=>v.classList.remove('switch-next','switch-prev'),280)}$('viewer').onclick=e=>{if(mode!=='read')return;if(e.target.closest('#exitHotspot'))return;if(e.target.tagName==='VIDEO'){renderCard();return}playCurrent()};$('prev').onclick=e=>{e.stopPropagation();go(-1)};$('next').onclick=e=>{e.stopPropagation();go(1)};const vw=$('viewer');vw.addEventListener('touchstart',e=>{touchCount=e.touches.length;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});vw.addEventListener('touchend',e=>{if(isPlaying)return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(document.body.classList.contains('child-mode')&&touchCount>=3&&dy>70){setChildMode(false);return}if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx>0?-1:1)},{passive:true});
function renderGrid(){const grid=$('grid');grid.innerHTML='';if(!groupItems.length){grid.innerHTML='<div class="empty"><strong>没有匹配素材。</strong><br>可以换一个组别，或清空搜索。</div>';return}for(const it of groupItems){const tile=document.createElement('button'),url=URL.createObjectURL(it.cover);tile.className='tile';tile.innerHTML=`<img src="${url}" alt=""><div class="tmeta"><strong>${esc(title(it))}</strong><span>${esc(it.group)}</span></div>`;tile.onclick=()=>{const g=currentGroup,arr=g==='全部'?allItems:(g==='最近添加'?[...allItems].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)):allItems.filter(x=>x.group===g));groupItems=arr;idx=Math.max(0,groupItems.findIndex(x=>x.key===it.key));setMode('read')};grid.appendChild(tile)}}async function tryFullscreen(on){try{if(on&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(!on&&document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen()}catch(e){}}function toast(msg){const t=$('exitToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}function setChildMode(on){setMode('read');document.body.classList.toggle('child-mode',on);$('childBtn').textContent=on?'退出全屏':'儿童全屏';if(on){tryFullscreen(true);scheduleRipple();toast('三指下滑或左上角长按退出')}else{tryFullscreen(false);stopRipple();toast('已退出儿童全屏')}}$('childBtn').onclick=()=>setChildMode(!document.body.classList.contains('child-mode'));$('exitHotspot').addEventListener('touchstart',()=>{exitPressTimer=setTimeout(()=>setChildMode(false),900)},{passive:true});$('exitHotspot').addEventListener('touchend',()=>clearTimeout(exitPressTimer),{passive:true});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('child-mode'))document.body.classList.remove('child-mode')});
const drawer=$('syncDrawer'),folderPicker=$('folderPicker'),photoPicker=$('photoPicker');$('syncBtn').onclick=()=>drawer.classList.add('show');$('closeDrawer').onclick=()=>drawer.classList.remove('show');$('chooseFolder').onclick=()=>folderPicker.click();$('choosePhotos').onclick=()=>photoPicker.click();$('clearLocal').onclick=async()=>{if(!confirm('确定清空本地素材？不会删除相册或文件里的原视频。'))return;await clearStore();allItems=[];currentGroup='全部';idx=0;await loadLibrary();$('syncStatus').innerHTML='<div class="sync-summary good">已清空本地素材库。</div>'};async function syncFiles(files,{folderMode=false}={}){const raw=[...files].filter(extOK),status=$('syncStatus'),list=$('syncList');list.innerHTML='';if(!raw.length){status.innerHTML='<div class="sync-summary bad">没有识别到视频。</div>';return}const valid=[],invalid=[],nested=[],duplicate=[],seen=new Set();for(const f of raw){if(folderMode&&!isTopLevel(f)){nested.push({f,reason:'多级目录'});continue}const meta=parseName(f.name);if(seen.has(meta.key)){duplicate.push({f,reason:'同名重复'});continue}seen.add(meta.key);valid.push({f,meta})}status.innerHTML=`<div class="sync-summary">发现 <b>${raw.length}</b> 个视频；有效 <b class="good">${valid.length}</b> 个；忽略 <b class="bad">${invalid.length+nested.length+duplicate.length}</b> 个。准备同步…</div>`;[...valid.map(x=>({...x,reason:'有效'})),...nested,...duplicate].slice(0,120).forEach(x=>{const meta=x.meta,r=document.createElement('div');r.className='file-row';const left=meta?`${esc(meta.group)} / ${esc(meta.name)}${meta.alias?' / '+esc(meta.alias):''}`:`<span class="bad">${esc(x.reason)}</span>`;r.innerHTML=`<span>${left}</span><span>${esc(x.f.name)}</span>`;list.appendChild(r)});try{const old=await getAll(),oldMap=new Map(old.map(x=>[x.key,x])),nextKeys=new Set(valid.map(x=>x.meta.key));let skipped=0,imported=0,deleted=0;for(let i=0;i<valid.length;i++){const{f,meta}=valid[i],prev=oldMap.get(meta.key),unchanged=prev&&prev.size===f.size&&prev.lastModified===f.lastModified&&prev.filename===f.name;if(unchanged){skipped++;continue}status.innerHTML=`<div class="sync-summary">正在处理 ${i+1} / ${valid.length}：<b>${esc(meta.name)}</b><br>正在提取封面…</div>`;const ex=await fileToCoverAndDuration(f);await putItem({key:meta.key,group:meta.group,name:meta.name,alias:meta.alias||'',filename:f.name,size:f.size,lastModified:f.lastModified,video:f,cover:ex.cover,duration:ex.duration,width:ex.width,height:ex.height,addedAt:prev?.addedAt||Date.now(),updatedAt:Date.now()});imported++}if(folderMode){for(const oldItem of old){if(!nextKeys.has(oldItem.key)){await deleteKey(oldItem.key);deleted++}}}currentGroup='最近添加';idx=0;await loadLibrary();status.innerHTML=`<div class="sync-summary good"><b>同步完成。</b><br>新增/更新：${imported}；跳过未变化：${skipped}${folderMode?'；删除本地失效：'+deleted:''}；忽略异常：${invalid.length+nested.length+duplicate.length}。</div>`}catch(e){console.error(e);status.innerHTML=`<div class="sync-summary bad"><b>同步失败：</b>${esc(e.message||String(e))}<br>建议优先使用 H.264/AAC 的 MP4/MOV，并避免单个视频过大。</div>`}}
folderPicker.addEventListener('change',async()=>{await syncFiles(folderPicker.files,{folderMode:true});folderPicker.value=''});photoPicker.addEventListener('change',async()=>{await syncFiles(photoPicker.files,{folderMode:false});photoPicker.value=''});async function regSW(){if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('./sw.js?v=24');if(r&&r.update)r.update()}catch(e){console.warn(e)}}}function installTip(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(!standalone&&!localStorage.getItem('tip-v24'))setTimeout(()=>$('installTip').classList.add('show'),1000)}$('closeTip').onclick=()=>{$('installTip').classList.remove('show');localStorage.setItem('tip-v24','1')};(async()=>{db=await openDB();await loadLibrary();setMode(mode);await regSW();installTip()})();
